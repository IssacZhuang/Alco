name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: Windows_Debug
            os: windows-2022
            configuration: Debug
            runtime: win-x64
          - build: Windows_Release
            os: windows-2022
            configuration: Release
            runtime: win-x64
          - build: Linux_Debug
            os: ubuntu-latest
            configuration: Debug
            runtime: linux-x64
          - build: Linux_Release
            os: ubuntu-latest
            configuration: Release
            runtime: linux-x64
          - build: MacOS_Debug
            os: macos-latest
            configuration: Debug
            runtime: osx-arm64
          - build: MacOS_Release
            os: macos-latest
            configuration: Release
            runtime: osx-arm64
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'
        
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@1.97.1
      with:
        targets: ${{ matrix.runtime == 'win-x64' && 'x86_64-pc-windows-msvc' || matrix.runtime == 'linux-x64' && 'x86_64-unknown-linux-gnu' || 'aarch64-apple-darwin' }}

    - name: Install Linux native build and software Vulkan dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libvulkan1 mesa-vulkan-drivers libx11-dev libxkbcommon0 libwayland-dev

    - name: Cache native build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: Src/Alco.Graphics.Native/alco-gpu -> ../../Alco.Graphics/obj/alco-gpu

    # Rebuild from source even on Windows so native changes cannot be hidden by a
    # committed DLL. Other RIDs also exercise the missing-library integration.
    # No solution-level -r: the SDK rejects RID-specific solution builds (NETSDK1134);
    # Directory.Build.props derives the matching RID from the runner OS.
    - name: Build
      run: dotnet build --configuration ${{ matrix.configuration }} -p:AlcoGpuBuildNative=true

    - name: Test
      run: dotnet test --configuration ${{ matrix.configuration }} --no-build --no-restore --logger trx --results-directory "TestResults-${{ matrix.runtime }}-${{ matrix.configuration }}"

    - name: Upload dotnet test results
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-results-${{ matrix.runtime }}-${{ matrix.configuration }}
        path: TestResults-${{ matrix.runtime }}-${{ matrix.configuration }}
      # Use always() to always run this step to publish test results when there are test failures
      if: ${{ always() }}
